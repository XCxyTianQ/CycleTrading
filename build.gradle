plugins {
    id 'java'
}

group = 'com.cycletrading'
// 版本号：CI 打标签构建时用 -PpkgVersion=<tag 去 v 前缀> 覆盖
version = providers.gradleProperty('pkgVersion').getOrElse('1.1.0')

base {
    archivesName = 'cycletrading-folia'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Paper/Folia 插件 API（与 AzureBranches EXP5Plus 同版本，MC 26.1.2）
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'

    // JSON 持久化（运行时由服务端 libraries 提供，版本与运行时一致：2.13.2）
    compileOnly 'com.google.code.gson:gson:2.13.2'
}

// 本地开发参考类路径（仅本机存在时加载；插件本身只依赖 paper-api，CI 环境自动跳过）
def nmsJar = file('F:/AzureCore/AzureBranches/folia-server/build/libs/versions/26.1.2/folia-26.1.2.jar')
if (nmsJar.exists()) {
    dependencies {
        compileOnly files(nmsJar)
    }
}
def libsDir = file('F:/AzureCore/AzureBranches/folia-server/build/libs/libraries')
if (libsDir.exists()) {
    dependencies {
        compileOnly fileTree(dir: libsDir, include: '**/*.jar')
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand 'version': project.version
    }
}
